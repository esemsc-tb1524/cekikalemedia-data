name: Publish to Supabase

# Runs only after a change has been reviewed and merged to main (or by hand).
# Secrets are never exposed to pull requests from forks.
on:
  push:
    branches: [main]
    paths:
      - data/media.csv
      - scripts/sync_supabase.py
      - scripts/validate.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 scripts/validate.py
      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/sync_supabase.py --dry-run
          else
            python3 scripts/sync_supabase.py
          fi
      - name: Notify the website
        # After a real publish only. A failure here must not mark the publish as failed:
        # the website also rebuilds by itself every day.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not set; skipping. The website's daily rebuild will pick the change up."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tim-boudot/cekikalemedia_website/dispatches \
            -d "{\"event_type\":\"data-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
          echo "Website notified for $SHA"
